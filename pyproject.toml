[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specbeat"
version = "0.1.0"
description = "Detecting faint spectroscopic companions in Fourier space."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sahar Shahaf" }]
keywords = ["astronomy", "spectroscopy", "binary stars", "Fourier analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# numpy, scipy and matplotlib, and nothing else. tests/test_isolation.py
# enforces this with an import check and an AST scan of the source.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/saharsh1/specbeat"
Issues = "https://github.com/saharsh1/specbeat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]
